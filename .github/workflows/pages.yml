name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deployment reads the build, so only one run may deploy at a time.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the site
        # A project site lives under /<repo>, so the app needs that base path.
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm run build

      - name: Serve the single-page app on unknown paths
        run: |
          cp frontend/build/index.html frontend/build/404.html
          touch frontend/build/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
